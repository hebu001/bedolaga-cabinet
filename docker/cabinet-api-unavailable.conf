# Static-only image: an external reverse proxy may route /api before this server.
location = /api {
    types { }
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"detail":"Cabinet backend is not configured"}';
}
location ^~ /api/ {
    types { }
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"detail":"Cabinet backend is not configured"}';
}
