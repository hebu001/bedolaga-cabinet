# Included from nginx's http context. Do not log URLs: query strings can contain WS tickets.
log_format cabinet '$remote_addr [$time_local] $request_method $status $body_bytes_sent $request_time';
map $http_upgrade $cabinet_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log cabinet;
    server_tokens off;

    include /etc/nginx/cabinet-api.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Only content-hashed Vite assets are immutable.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|json|css|woff2?|png|jpe?g|webp|svg|ico)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
